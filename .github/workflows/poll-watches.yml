name: Poll watches

# The watcher engine only runs when something calls it. This lives in the repo
# rather than a third-party dashboard so it is versioned, reviewable, and — the
# part that matters — fails loudly in the Actions tab instead of silently
# disappearing.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

# A slow run should never pile up behind the next tick.
concurrency:
  group: poll-watches
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger watcher engine
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Must be the host that SERVES the app, not one that redirects to it: curl
          # drops the Authorization header across a host change, so a redirect here
          # silently costs us the CRON_SECRET. Check with `curl -sI` after any
          # domain change in Vercel.
          POLL_URL: https://www.alertings.app/api/cron/poll
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set — the poll would 401."
            exit 1
          fi

          code=$(curl -sS --max-time 120 \
            -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$POLL_URL")

          echo "HTTP $code"
          cat response.json
          echo

          case "$code" in
            3??)
              echo "::error::POLL_URL redirected (HTTP $code) — point it at the canonical host. Following the redirect is not a fix: curl strips Authorization across hosts, so the poll would 401."
              exit 1
              ;;
            200) ;;
            *)
              echo "::error::Poll failed with HTTP $code"
              exit 1
              ;;
          esac

          # A 200 that reports engine errors still deserves a visible warning.
          if grep -q '"errors":\[[^]]' response.json; then
            echo "::warning::Poll succeeded but the engine reported errors (see response above)."
          fi
